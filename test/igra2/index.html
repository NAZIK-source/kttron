<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<!-- Тестовая версия игры (вариант 2): не индексировать, на сайте ссылок нет -->
<meta name="robots" content="noindex, nofollow" />
<title>Школа мастера КТ ТРОН</title>
<link rel="icon" type="image/svg+xml" href="/images/favicon.svg" />
<link rel="alternate icon" href="/favicon.ico" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@400;500;700;800&display=swap">
<style>
/* Layout: игровой мир в фирменных цветах КТ ТРОН — ночная синяя «чертёжная» сцена, белые игровые панели, объёмные кнопки, HUD сверху */
:root{
  --night:#00253f; --night2:#00466e; --brand:#0093dd; --brand-deep:#0077b3; --brand-soft:#e5f5fc; --sky:#9ad6f5;
  --ink:#1f2a33; --muted:#5f6b75; --panel:#ffffff; --line:#d5e3ec; --press:#c7d7e2;
  --gold:#ffc83d; --gold-deep:#d99a00; --good:#22b35e; --good-deep:#168043; --good-bg:#e4f7ec;
  --bad:#ef4b3f; --bad-deep:#b02c22; --bad-bg:#fdeceb;
  --f-display:"Russo One","Arial Black",Arial,sans-serif;
  --f-body:"Rubik",Arial,Helvetica,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--night)}
body{min-height:100vh;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  background:
    radial-gradient(1200px 500px at 50% -10%,#0093dd55,transparent 70%),
    linear-gradient(#ffffff0d 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(90deg,#ffffff0d 1px,transparent 1px) 0 0/44px 44px,
    linear-gradient(180deg,var(--night2),var(--night) 70%);
  background-attachment:fixed;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-block:14px 40px}
.wrap{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--brand-deep)}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;color:#fff}
.logo{display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none}
.logo svg{width:30px;height:34px;color:var(--sky)}
.logo b{font-family:var(--f-display);font-weight:400;font-size:18px;letter-spacing:.02em;display:block;line-height:1}
.logo small{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--sky)}
.top-right{display:flex;gap:8px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;background:#ffffff1a;border:1px solid #ffffff33;color:#fff;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.pill svg{width:18px;height:18px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid #ffffff33;background:#ffffff1a;color:#fff;display:grid;place-items:center}
.iconbtn svg{width:20px;height:20px}

.panel{background:var(--panel);border-radius:22px;box-shadow:0 8px 0 #00000033,0 24px 50px #0000004d;padding:20px clamp(14px,4vw,26px);display:flex;flex-direction:column;gap:16px;position:relative}
.panel.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.92);opacity:.3}to{transform:none;opacity:1}}

.btn{border:0;border-radius:14px;background:var(--brand);color:#fff;font-family:var(--f-display);font-size:16px;letter-spacing:.03em;text-transform:uppercase;
  padding:14px 22px;min-height:52px;box-shadow:0 5px 0 var(--brand-deep);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;text-align:center}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-deep)}
.btn.gold{background:var(--gold);color:#4a3200;box-shadow:0 5px 0 var(--gold-deep)}
.btn.gold:active{box-shadow:0 1px 0 var(--gold-deep)}
.btn.green{background:#25d366;box-shadow:0 5px 0 #149447}
.btn.ghost{background:var(--brand-soft);color:var(--brand-deep);box-shadow:0 5px 0 var(--press)}
.btn.ghost:active{box-shadow:0 1px 0 var(--press)}
.btn.big{font-size:19px;min-height:60px;padding:16px 28px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.row.center{justify-content:center}
.grow{flex:1}

.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.hero h1{font-size:clamp(28px,7vw,44px);color:var(--brand-deep)}
.hero h1 span{display:block;font-size:.42em;color:var(--muted);letter-spacing:.14em;margin-top:6px;font-family:var(--f-body);font-weight:800;text-transform:uppercase}
.hero .mascot{width:clamp(90px,24vw,130px)}
.tagline{font-size:16px;color:var(--muted);max-width:52ch}
@media (max-width:440px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}}

.mascot{display:block;overflow:visible}
.mascot .eyes{animation:blink 4s infinite;transform-origin:50% 66%;transform-box:fill-box}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.mascot.bounce{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.map{border-radius:18px;overflow:hidden;border:3px solid var(--line)}
.floor{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px 14px;position:relative;width:100%;border:0;text-align:left;border-bottom:2px solid #00000012}
.floor.above{background:linear-gradient(180deg,#eaf6fd,#d9eefa)}
.floor.below{background:repeating-linear-gradient(135deg,#d9d2c5 0 6px,#d3cbbd 6px 12px)}
.floor.below.deep{background:repeating-linear-gradient(135deg,#cbc2b2 0 6px,#c4bba9 6px 12px)}
.ground-line{height:10px;background:linear-gradient(180deg,#6fbf4a,#4f9a33);border-top:2px solid #3f7d28}
.node{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--brand);box-shadow:0 5px 0 var(--brand-deep),0 0 0 4px #fff;position:relative}
.floor:disabled{cursor:not-allowed}
.floor:disabled .node{background:#9aa6ae;box-shadow:0 5px 0 #6f7b83,0 0 0 4px #fff}
.floor:disabled .t{opacity:.6}
.floor.done .node{background:var(--good);box-shadow:0 5px 0 var(--good-deep),0 0 0 4px #fff}
.floor.current .node{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 5px 0 var(--brand-deep),0 0 0 4px #fff,0 0 0 4px #0093dd66}50%{box-shadow:0 5px 0 var(--brand-deep),0 0 0 4px #fff,0 0 0 14px #0093dd00}}
.node svg{width:26px;height:26px}
.floor .t{min-width:0}
.floor .t b{display:block;font-family:var(--f-display);font-weight:400;font-size:16px;line-height:1.2}
.floor .t span{font-size:13px;color:var(--muted)}
.floor .mark{position:absolute;right:12px;top:5px;font-size:11px;font-weight:800;color:#0000005c;font-variant-numeric:tabular-nums}
.stars{display:inline-flex;gap:2px}
.stars svg{width:20px;height:20px}
.floor:not(:disabled):hover .t b{color:var(--brand-deep)}
@media (max-width:440px){.floor{grid-template-columns:58px 1fr}.floor .stars{grid-column:2}}

.hud{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hearts{display:flex;gap:3px}
.hearts svg{width:26px;height:26px;transition:transform .2s,opacity .2s}
.hearts svg.lost{transform:scale(.85);opacity:.3}
.hearts svg.hit{animation:hit .5s}
@keyframes hit{30%{transform:scale(1.4) rotate(-10deg);opacity:1}100%{transform:scale(.85)}}
.coins{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-size:18px;color:#7a5600;background:#fff4d1;border-radius:999px;padding:4px 12px 4px 6px;font-variant-numeric:tabular-nums}
.coins svg{width:22px;height:22px}
.combo{font-family:var(--f-display);font-size:14px;color:#fff;background:linear-gradient(90deg,#ff7a2f,#ff3d6e);border-radius:999px;padding:4px 10px}
.bar{height:12px;background:var(--brand-soft);border-radius:999px;overflow:hidden;flex:1 1 100%}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--sky));border-radius:999px;transition:width .4s}
.smallbtn{border:0;background:var(--brand-soft);color:var(--brand-deep);border-radius:10px;padding:7px 11px;font-weight:800;font-size:13px;box-shadow:0 3px 0 var(--press)}
.smallbtn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--press)}

.scene{border-radius:16px;overflow:hidden;background:#0b3654;position:relative}
.scene svg{display:block;width:100%;height:auto}
.scene .cap{position:absolute;left:10px;top:10px;background:#000000a0;color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.06em;text-transform:uppercase}
.drip{animation:drip 1s linear infinite}
@keyframes drip{from{transform:translate(0,0);opacity:1}to{transform:translate(28px,70px);opacity:0}}
.wave{animation:wave 3s ease-in-out infinite alternate}
@keyframes wave{to{transform:translateX(-30px)}}

.talk{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:end}
.talk .mascot{width:84px}
.bubble{background:var(--brand-soft);border-radius:18px 18px 18px 4px;padding:14px 16px;font-size:17px;position:relative;min-height:64px;min-width:0}
.bubble b{color:var(--brand-deep)}
.bubble .who{display:block;font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--brand);margin-bottom:4px}
.facts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.fact{background:#fff;border-radius:10px;padding:6px 10px;font-size:13px;border:2px solid var(--line)}
.fact b{display:block;font-family:var(--f-display);font-weight:400;font-size:15px;color:var(--brand-deep);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brand)}
@media (max-width:440px){.talk{grid-template-columns:60px 1fr}.talk .mascot{width:60px}}

.q{font-family:var(--f-display);font-size:clamp(19px,4.4vw,24px);line-height:1.25;color:var(--ink)}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;background:#fff;border:3px solid var(--line);border-radius:16px;padding:12px 14px;min-height:58px;font-size:16px;font-weight:500;box-shadow:0 4px 0 var(--line);transition:transform .08s}
.opt:hover:not(:disabled){border-color:var(--brand);box-shadow:0 4px 0 var(--brand)}
.opt:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--brand)}
.opt .k{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);background:var(--brand);color:#fff}
.opt.ok{border-color:var(--good);background:var(--good-bg);box-shadow:0 4px 0 var(--good)}
.opt.ok .k{background:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg);box-shadow:0 4px 0 var(--bad)}
.opt.no .k{background:var(--bad)}
.opt:disabled{cursor:default}
.fb{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border-radius:16px;padding:12px 14px}
.fb .mascot{width:54px}
.fb.ok{background:var(--good-bg);border:2px solid var(--good)}
.fb.no{background:var(--bad-bg);border:2px solid var(--bad)}
.fb b{font-family:var(--f-display);font-weight:400;font-size:17px;display:block}
.fb.ok b{color:var(--good-deep)} .fb.no b{color:var(--bad-deep)}

.slots{display:grid;gap:8px}
.slot{display:flex;gap:10px;align-items:center;border:3px dashed var(--line);border-radius:14px;padding:10px 12px;min-height:52px;color:var(--muted)}
.slot .n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:#fff;font-family:var(--f-display)}
.slot.on{border-style:solid;border-color:var(--good);background:var(--good-bg);color:var(--ink);animation:pop .3s}
.slot.on .n{background:var(--good)}
.slot.next{border-color:var(--brand)}
.slot.next .n{background:var(--brand)}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.card{background:#fff;border:3px solid var(--brand);border-radius:14px;padding:10px 14px;font-weight:700;font-size:15px;text-align:left;box-shadow:0 4px 0 var(--brand-deep);max-width:100%}
.card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--brand-deep)}
.card.wrong{animation:shake .35s;border-color:var(--bad);box-shadow:0 4px 0 var(--bad-deep)}
.hint{font-size:14px;color:var(--muted)}

.sortcard{border-radius:18px;padding:28px 18px;text-align:center;font-family:var(--f-display);font-size:clamp(20px,5vw,26px);color:#fff;background:linear-gradient(135deg,var(--brand-deep),var(--night2));box-shadow:0 6px 0 var(--night)}
.sortcard.fly-yes{animation:flyR .35s forwards}.sortcard.fly-no{animation:flyL .35s forwards}
@keyframes flyR{to{transform:translateX(60%) rotate(12deg);opacity:0}}@keyframes flyL{to{transform:translateX(-60%) rotate(-12deg);opacity:0}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.no{background:var(--bad);box-shadow:0 5px 0 var(--bad-deep)}
.btn.yes{background:var(--good);box-shadow:0 5px 0 var(--good-deep)}
.counter{text-align:center;font-weight:800;color:var(--muted);font-size:13px;letter-spacing:.1em}

.dial{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap}
.dial input{width:5.5ch;font-family:var(--f-display);font-size:38px;text-align:center;border:3px solid var(--line);border-radius:16px;padding:6px 8px;color:var(--brand-deep);background:#fff;font-variant-numeric:tabular-nums}
.dial .unit{font-family:var(--f-display);font-size:18px;color:var(--muted)}
.round{width:58px;height:58px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-family:var(--f-display);font-size:28px;box-shadow:0 5px 0 var(--brand-deep);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.round:active{transform:translateY(4px);box-shadow:0 1px 0 var(--brand-deep)}
.round:disabled{opacity:.4}

.holdzone{display:grid;gap:14px;justify-items:center}
.timer{font-family:var(--f-display);font-size:54px;color:var(--brand-deep);line-height:1;font-variant-numeric:tabular-nums}
.timer small{font-size:18px;color:var(--muted)}
.gauge{position:relative;width:100%;max-width:440px;height:20px;background:var(--brand-soft);border-radius:999px;overflow:hidden;border:3px solid var(--line)}
.gauge .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--brand),var(--sky))}
.gauge .zone{position:absolute;top:0;bottom:0;background:#22b35e55;border-left:3px solid var(--good);border-right:3px solid var(--good)}
.ticks{position:relative;width:100%;max-width:440px;height:16px;font-size:12px;font-weight:800;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.holdbtn{width:150px;height:150px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#ffd76b,var(--gold) 55%,var(--gold-deep));color:#4a3200;font-family:var(--f-display);font-size:17px;line-height:1.15;box-shadow:0 8px 0 #a87400,0 0 0 8px #fff4d1;user-select:none;-webkit-user-select:none;touch-action:none}
.holdbtn.on{transform:translateY(6px) scale(.97);box-shadow:0 2px 0 #a87400,0 0 0 14px #ffc83d55}

.result{display:grid;justify-items:center;gap:12px;text-align:center}
.result h2{font-size:clamp(26px,6vw,36px);color:var(--brand-deep)}
.result .mascot{width:110px}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:clamp(56px,14vw,76px);height:clamp(56px,14vw,76px);animation:starin .5s cubic-bezier(.3,1.6,.5,1) both}
.bigstars svg:nth-child(2){animation-delay:.25s}
.bigstars svg:nth-child(3){animation-delay:.5s}
@keyframes starin{from{transform:scale(0) rotate(-40deg);opacity:0}to{transform:none;opacity:1}}
.tally{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{background:var(--brand-soft);border-radius:14px;padding:10px 16px;min-width:110px}
.tile b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;color:var(--brand-deep);font-variant-numeric:tabular-nums}
.tile span{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.cert{width:100%;border-radius:20px;padding:24px 18px;color:#fff;text-align:center;display:grid;gap:10px;justify-items:center;
  background:linear-gradient(#ffffff12 1px,transparent 1px) 0 0/36px 36px,linear-gradient(90deg,#ffffff12 1px,transparent 1px) 0 0/36px 36px,linear-gradient(135deg,var(--night2),var(--brand-deep))}
.cert .rank{font-family:var(--f-display);font-size:clamp(20px,5.4vw,30px);background:var(--gold);color:#4a3200;border-radius:14px;padding:8px 18px;box-shadow:0 5px 0 var(--gold-deep)}
.cert small{color:var(--sky);font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:11px}
.cta{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;width:100%}
.note{font-size:12px;color:#ffffffa6;text-align:center}
.muted{color:var(--muted);font-size:14px}

.modal{position:fixed;inset:0;background:#00172acc;display:grid;place-items:center;z-index:30;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .panel{max-width:560px;width:100%;max-height:90vh;overflow:auto}
.book{display:grid}
.book div{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:2px solid var(--brand-soft);font-size:15px}
.book div b{color:var(--brand-deep);text-align:right;font-variant-numeric:tabular-nums}
.book-steps{margin:0;padding-left:22px;display:grid;gap:4px;font-size:15px}

.float{position:fixed;z-index:40;pointer-events:none;font-family:var(--f-display);font-size:26px;color:var(--gold);text-shadow:0 2px 0 #7a5600,0 0 12px #0006;animation:floatUp 1s ease-out forwards}
.float.bad{color:#fff;text-shadow:0 2px 0 var(--bad-deep),0 0 10px var(--bad)}
@keyframes floatUp{from{transform:translate(-50%,0) scale(.8);opacity:0}20%{opacity:1;transform:translate(-50%,-10px) scale(1.15)}to{transform:translate(-50%,-70px) scale(1);opacity:0}}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:35;width:100%;height:100%}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

let ac=null;
function tone(f,d=.12,type='sine',v=.18,delay=0){
  if(!save.sound) return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended') ac.resume();
    const t=ac.currentTime+delay, o=ac.createOscillator(), g=ac.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d+.02);
  }catch(e){}
}
const sfx={
  click:()=>tone(660,.06,'triangle',.12),
  good:()=>{tone(660,.1,'triangle');tone(880,.12,'triangle',.18,.09);tone(1320,.18,'triangle',.14,.18);},
  bad:()=>{tone(220,.18,'sawtooth',.12);tone(160,.25,'sawtooth',.1,.12);},
  coin:()=>{tone(988,.07,'square',.08);tone(1319,.12,'square',.08,.06);},
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.16,i*.12)),
  lose:()=>[392,330,262,196].forEach((f,i)=>tone(f,.3,'sawtooth',.09,i*.18)),
};

function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=document.getElementById('confetti'), x=c.getContext('2d'); c.hidden=false;
  const W=c.width=innerWidth, H=c.height=innerHeight, cols=['#0093dd','#9ad6f5','#ffc83d','#22b35e','#ffffff','#ff6b6b'];
  const P=Array.from({length:140},()=>({x:Math.random()*W,y:-20-Math.random()*H*.5,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,s:6+Math.random()*7,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){ x.clearRect(0,0,W,H);
    P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore();});
    if(t-t0<3200) requestAnimationFrame(f); else {x.clearRect(0,0,W,H);c.hidden=true;}
  })(t0);
}

      <span class="stars">${st?starRow(st.stars):''}</span><span class="mark">▽ ${l.mark}</span></button>`);

  });
  const pl=p.querySelector('#play'); if(pl) pl.onclick=()=>{sfx.click(); intro(cur);};
  const ce=p.querySelector('#cert'); if(ce) ce.onclick=()=>{sfx.click(); certificate();};

function intro(i){
  const l=LEVELS[i]; let k=0;
  const p=h(`<section class="panel pop">
    <div class="row"><span class="muted" style="font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:12px">Уровень ${i+1} · ${esc(l.place)}</span><span class="grow"></span><button class="smallbtn" id="map">✕ Карта</button></div>

    <div class="scene">${SCENES[l.scene]()}<span class="cap">▽ ${l.mark}</span></div>
    <div class="talk">${mascot('happy')}<div class="bubble" id="bub" aria-live="polite"></div></div>
    <div class="dots">${l.talk.map(()=>'<i></i>').join('')}</div>
    <div class="row end"><button class="smallbtn" id="skip">Пропустить</button><button class="btn" id="next">Дальше</button></div>
  </section>`);
  const bub=p.querySelector('#bub'), dots=p.querySelectorAll('.dots i'), nx=p.querySelector('#next');
  function show(){
    const m=l.talk[k];
    bub.innerHTML='<span class="who">Капитан Трон</span>'+(typeof m==='string'?m:esc(m.t)+'<div class="facts">'+m.facts.map(f=>`<span class="fact"><b>${esc(f[0])}</b>${esc(f[1])}</span>`).join('')+'</div>');
    bub.classList.remove('pop'); void bub.offsetWidth; bub.classList.add('pop');
    dots.forEach((d,j)=>d.classList.toggle('on',j<=k));
    const last=k===l.talk.length-1;
    nx.textContent=last?'К заданиям!':'Дальше'; nx.classList.toggle('gold',last);
  }
  nx.onclick=()=>{ sfx.click(); if(k<l.talk.length-1){k++;show();} else start(i); };
  p.querySelector('#skip').onclick=()=>{sfx.click(); start(i);};
  p.querySelector('#map').onclick=()=>{sfx.click(); home();};
  mount(p); show();
}

function task(){
  const l=LEVELS[run.li], t=l.tasks[run.ti];
  const p=h(`<section class="panel pop">

  </section>`);
  p.querySelector('#book').onclick=()=>{sfx.click(); book(l);};
  p.querySelector('#quit').onclick=()=>{sfx.click(); confirmQuit(p);};
  mount(p);
  const ctx={l,t,p,body:p.querySelector('#body'),fb:p.querySelector('#fb'),nav:p.querySelector('#nav')};
  ({choice:tChoice,order:tOrder,sort:tSort,number:tNumber,hold:tHold})[t.type](ctx);
}

function confirmQuit(p){
  const nav=p.querySelector('#nav'), prev=[...nav.children];
  const box=h(`<div class="row"><span class="muted">Выйти? Прогресс уровня пропадёт.</span><button class="smallbtn" id="no">Остаться</button><button class="btn" id="yes" style="min-height:40px;padding:8px 14px;font-size:13px">Выйти</button></div>`);
  box.querySelector('#yes').onclick=home;
  box.querySelector('#no').onclick=()=>nav.replaceChildren(...prev);
  nav.replaceChildren(box);
}

    ${l.steps?`<div><div class="muted" style="font-weight:800;margin-bottom:6px">Порядок работ</div><ol class="book-steps">${l.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol></div>`:''}
    <a href="${l.url}" target="_blank" rel="noopener">Полное описание на kttron.kz ↗</a>
  </div></div>`);
  const onKey=e=>{if(e.key==='Escape')close();};
  const close=()=>{m.remove(); document.removeEventListener('keydown',onKey);};
  m.onclick=e=>{if(e.target===m)close();};
  m.querySelector('#x').onclick=close;
  document.addEventListener('keydown',onKey);
  document.body.appendChild(m); m.querySelector('#x').focus();
}

/* scoring */
function reward(ctx,base,anchor){
  run.streak++;
  const got=base*mult(); run.coins+=got;
  ctx.p.querySelector('#coins span').textContent=run.coins;
  const cb=ctx.p.querySelector('#combo');
  if(run.streak>=3){cb.hidden=false;cb.textContent='КОМБО ×'+mult();cb.classList.remove('pop');void cb.offsetWidth;cb.classList.add('pop');}
  sfx.good(); setTimeout(sfx.coin,250);
  floatText('+'+got,anchor||ctx.p.querySelector('#coins'));
}
function penalty(ctx,anchor){
  run.streak=0; run.hearts=Math.max(0,run.hearts-1);
  const hh=ctx.p.querySelectorAll('#hearts svg')[run.hearts]; if(hh) hh.classList.add('lost','hit');
  ctx.p.querySelector('#combo').hidden=true;
  ctx.p.classList.remove('shake'); void ctx.p.offsetWidth; ctx.p.classList.add('shake');
  sfx.bad(); floatText('−1 ❤',anchor||ctx.p.querySelector('#hearts'),true);
  try{ navigator.vibrate&&navigator.vibrate(120); }catch(e){}
  return run.hearts===0;
}
function say(ctx,ok,title,text){
  ctx.fb.replaceChildren(h(`<div class="fb ${ok?'ok':'no'} pop">${mascot(ok?'happy':'sad')}<div><b>${esc(title)}</b><span>${esc(text)}</span></div></div>`));
}
function nextBtn(ctx){
  if(run.hearts===0){ const b=h('<button class="btn">Что дальше?</button>'); b.onclick=lose; ctx.nav.replaceChildren(b); b.focus({preventScroll:true}); return; }
  const last=run.ti===ctx.l.tasks.length-1;
  const b=h(`<button class="btn ${last?'gold':''}">${last?'Сдать объект':'Дальше'}</button>`);
  b.onclick=()=>{sfx.click(); if(last) win(); else {run.ti++; task();}};
  ctx.nav.replaceChildren(b); b.focus({preventScroll:true});
}

/* --- choice --- */
function tChoice(ctx){
  const box=h('<div class="opts"></div>'), opts=shuffle(ctx.t.options);
  opts.forEach((o,k)=>{
    const b=h(`<button class="opt"><span class="k">${'АБВГ'[k]}</span><span>${esc(o.t)}</span></button>`);
    b.onclick=()=>{
      box.querySelectorAll('button').forEach((x,j)=>{x.disabled=true; if(opts[j].ok) x.classList.add('ok');});
      if(o.ok){ reward(ctx,100,b); say(ctx,true,['Точно!','В яблочко!','Мастерски!'][Math.random()*3|0],o.why); }
      else { b.classList.add('no'); penalty(ctx,b); say(ctx,false,'Ошибка',o.why); }
      nextBtn(ctx);
    };
    box.appendChild(b);
  });
  ctx.body.appendChild(box);
}

/* --- order --- */
function tOrder(ctx){
  const steps=ctx.l[ctx.t.from]; let n=0, miss=0;
  const slots=h(`<div class="slots">${steps.map((_,i)=>`<div class="slot ${i===0?'next':''}"><span class="n">${i+1}</span><span>?</span></div>`).join('')}</div>`);
  const cards=h('<div class="cards"></div>');
  const hint=h('<p class="hint">Нажимай карточки в правильном порядке. Ошибка стоит сердечка.</p>');
  shuffle(steps.map((t,i)=>({t,i}))).forEach(s=>{
    const c=h(`<button class="card">${esc(s.t)}</button>`);
    c.onclick=()=>{
      if(run.hearts===0) return;
      if(s.i===n){
        const sl=slots.children[n]; sl.classList.remove('next'); sl.classList.add('on'); sl.children[1].textContent=s.t;
        c.remove(); n++; tone(520+n*90,.09,'triangle',.14);
        if(slots.children[n]) slots.children[n].classList.add('next');
        if(n===steps.length){
          hint.remove();
          if(miss===0){ reward(ctx,150); say(ctx,true,'Идеальная технология!','Ни одной ошибки: бонус +150.'); }
          else { reward(ctx,50); say(ctx,true,'Технология собрана','Порядок важен: пропущенный шаг на объекте оборачивается переделкой.'); }
          nextBtn(ctx);
        }
      } else {
        miss++; c.classList.remove('wrong'); void c.offsetWidth; c.classList.add('wrong');
        const dead=penalty(ctx,c);
        hint.innerHTML=`Не тот шаг! Подсказка: следующий начинается со слов <b>«${esc(steps[n].split(' ').slice(0,2).join(' '))}…»</b>`;
        if(dead){ say(ctx,false,'Сердечки закончились','Загляни в «Справочник»: там весь порядок работ.'); nextBtn(ctx); }
      }
    };
    cards.appendChild(c);
  });
  ctx.body.append(slots,h('<div style="height:12px"></div>'),cards,hint);
}

/* --- sort --- */
function tSort(ctx){
  const items=shuffle(ctx.t.items); let k=0;
  const wrap=h('<div style="display:grid;gap:12px"></div>');
  function show(){
    ctx.fb.replaceChildren(); ctx.nav.replaceChildren();
    if(k>=items.length){ say(ctx,true,'Сортировка завершена','КТ ТРОН-1 работает в бетоне: в резервуарах, подвалах, бассейнах и коллекторах.'); wrap.remove(); nextBtn(ctx); return; }
    const it=items[k];
    wrap.replaceChildren(h(`<div class="counter">${k+1} / ${items.length}</div>`), h(`<div class="sortcard pop">${esc(it.t)}</div>`));
    const two=h('<div class="two"><button class="btn no">✕ Не подходит</button><button class="btn yes">✓ Подходит</button></div>');
    const [bn,by]=two.children, card=wrap.children[1];
    const pick=ans=>{
      bn.disabled=by.disabled=true; card.classList.add(ans?'fly-yes':'fly-no');
      if(ans===it.ok){ reward(ctx,50,ans?by:bn); say(ctx,true,'Верно!',it.why); } else { penalty(ctx,ans?by:bn); say(ctx,false,'Ошибка',it.why); }
      if(run.hearts===0){ nextBtn(ctx); return; }
      const nx=h('<button class="btn">Следующая</button>');
      nx.onclick=()=>{ sfx.click(); k++; show(); };
      ctx.nav.replaceChildren(nx); nx.focus({preventScroll:true});
    };
    bn.onclick=()=>pick(false); by.onclick=()=>pick(true);
    wrap.append(two);
  }
  ctx.body.append(wrap); show();
}

/* --- number --- */
function tNumber(ctx){
  const t=ctx.t; let v=t.start, timer=null;
  const id=`n-${ctx.l.id}-${run.ti}`;
  const d=h(`<div class="dial"><button class="round" aria-label="Меньше">−</button><input id="${id}" inputmode="decimal" aria-label="Ответ" value="${fmt(v,t.dec)}"><button class="round" aria-label="Больше">+</button><span class="unit">${esc(t.unit)}</span></div>`);
  const [mi,inp,pl]=d.children;
  const set=x=>{v=Math.min(t.max,Math.max(t.min,Math.round(x/t.step)*t.step)); inp.value=fmt(v,t.dec);};
  const stop=()=>{clearTimeout(timer); timer=null;};
  const hold=(btn,dir)=>{
    const go=()=>{set(v+dir*t.step); tone(600,.03,'square',.05);};
    btn.addEventListener('pointerdown',e=>{ e.preventDefault(); stop(); go(); let delay=380; const loop=()=>{go(); delay=Math.max(45,delay*.8); timer=setTimeout(loop,delay);}; timer=setTimeout(loop,delay); });
    ['pointerup','pointerleave','pointercancel'].forEach(ev=>btn.addEventListener(ev,stop));
    btn.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();go();} });
  };
  hold(mi,-1); hold(pl,1);
  inp.onchange=()=>{const x=parseFloat(inp.value.replace(',','.')); set(isNaN(x)?v:x);};
  inp.onkeydown=e=>{ if(e.key==='Enter') ch.click(); };
  const ch=h('<button class="btn gold">Проверить</button>');
  ch.onclick=()=>{
    stop(); inp.onchange();
    [mi,inp,pl].forEach(e=>e.disabled=true); ch.remove();
    const ok=v>=t.lo-1e-9&&v<=t.hi+1e-9;
    const ans=t.lo===t.hi?fmt(t.lo,t.dec):fmt(t.lo,t.dec)+'–'+fmt(t.hi,t.dec);
    if(ok){ reward(ctx,120,inp); say(ctx,true,'Расчёт верный!',t.why); }
    else { penalty(ctx,inp); say(ctx,false,`Правильно: ${ans} ${t.unit}`,t.why); }
    nextBtn(ctx);
  };
  ctx.body.append(d); ctx.nav.append(ch);
}

/* --- hold --- */
function tHold(ctx){
  const t=ctx.t, MAX=7;
  const z=h(`<div class="holdzone">
    <div class="scene" style="width:100%">${SCENES.leak()}<span class="cap">Держи пробку!</span></div>
    <div class="timer"><span id="tm">0,0</span> <small>мин</small></div>
    <div class="gauge"><div class="zone" style="left:${t.lo/MAX*100}%;width:${(t.hi-t.lo)/MAX*100}%"></div><div class="fill"></div></div>
    <div class="ticks">${rep(MAX+1,m=>`<span style="left:${m/MAX*100}%">${m}</span>`)}</div>
    <button class="holdbtn" id="hb">Прижать<br>и держать</button>
    <p class="hint" style="text-align:center">Удерживай пальцем, мышью или пробелом. Отпусти в зелёной зоне.</p>
  </div>`);
  const tm=z.querySelector('#tm'), fill=z.querySelector('.fill'), btn=z.querySelector('#hb'), water=z.querySelector('.water');
  let t0=0, raf=0, on=false, fin=false, sec=0;
  const tick=()=>{ const m=(performance.now()-t0)/1000; tm.textContent=fmt(m,1); fill.style.width=Math.min(100,m/MAX*100)+'%';
    if(Math.floor(m)>sec){sec=Math.floor(m); tone(m>=t.lo&&m<=t.hi?880:440,.05,'square',.06);}
    if(m>=MAX){up();return;} raf=requestAnimationFrame(tick); };
  const down=e=>{ if(fin||on||run.hearts===0) return; e&&e.preventDefault(); on=true; sec=0; btn.classList.add('on'); water.style.visibility='hidden'; t0=performance.now(); raf=requestAnimationFrame(tick); };
  const up=()=>{
    if(!on||fin) return; on=false; cancelAnimationFrame(raf); btn.classList.remove('on');
    const m=(performance.now()-t0)/1000;
    if(m<t.lo){
      water.style.visibility='';
      const dead=penalty(ctx,btn);
      say(ctx,false,`Рано: ${fmt(m,1)} мин`,'Состав не схватился, и вода выдавила пробку! '+t.why);
      if(dead){ fin=true; btn.disabled=true; nextBtn(ctx); }
      return;
    }
    fin=true; btn.disabled=true;
    if(m<=t.hi){ reward(ctx,150,btn); say(ctx,true,`Течь остановлена за ${fmt(m,1)} мин!`,t.why); }
    else { reward(ctx,60,btn); say(ctx,true,`Течь остановлена, но ты держал ${fmt(m,1)} мин`,'Можно было отпустить раньше. '+t.why); }
    nextBtn(ctx);
  };
  btn.addEventListener('pointerdown',down);
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>btn.addEventListener(ev,up));
  btn.addEventListener('contextmenu',e=>e.preventDefault());
  btn.addEventListener('keydown',e=>{if((e.code==='Space'||e.key==='Enter')&&!e.repeat)down(e);});
  btn.addEventListener('keyup',e=>{if(e.code==='Space'||e.key==='Enter')up();});
  ctx.body.append(z);
}

/* ================= END SCREENS ================= */
function win(){
  const l=LEVELS[run.li], stars=run.hearts, i=run.li;
  const prev=save.lv[l.id];
  save.lv[l.id]={stars:Math.max(stars,prev?.stars||0), coins:Math.max(run.coins,prev?.coins||0)};
  persist(); refreshTop(); sfx.win(); confetti();
  const hasNext=i<LEVELS.length-1;
  const p=h(`<section class="panel pop"><div class="result">
    ${mascot('wow','bounce')}
    <h2>Объект сдан!</h2>
    <p class="muted">${esc(l.title)} · ${esc(l.product)}</p>
    <div class="bigstars">${[0,1,2].map(j=>icon(j<stars?'i-star':'i-star-off')).join('')}</div>
    <div class="tally">
      <div class="tile"><b>${run.coins}</b><span>монет</span></div>
      <div class="tile"><b>${run.hearts}/3</b><span>сердечек</span></div>
    </div>
    <p>${stars===3?'Без единой ошибки! Заказчик в восторге.':stars===2?'Хорошая работа, почти без ошибок.':'Объект сдан на грани. Попробуй пройти на 3 звезды!'}</p>
    <div class="row center">
      <button class="btn ghost" id="again">Ещё раз</button>
      <button class="btn ghost" id="map">Карта</button>
      <button class="btn gold" id="next">${hasNext?'Следующий объект':'Удостоверение'}</button>
    </div></div></section>`);
  p.querySelector('#again').onclick=()=>{sfx.click(); start(i);};
  p.querySelector('#map').onclick=()=>{sfx.click(); home();};
  p.querySelector('#next').onclick=()=>{sfx.click(); hasNext?intro(i+1):certificate();};
  mount(p);
}
function lose(){
  sfx.lose(); const i=run.li;
  const p=h(`<section class="panel pop"><div class="result">
    ${mascot('sad')}
    <h2 style="color:var(--bad-deep)">Объект провален</h2>
    <p class="muted">Сердечки закончились. Перечитай подсказки Капитана Трона и попробуй снова. Цифры есть в «Справочнике».</p>
    <div class="row center"><button class="btn ghost" id="map">Карта</button><button class="btn ghost" id="talk">Брифинг</button><button class="btn gold" id="again">Заново</button></div>
  </div></section>`);
  p.querySelector('#again').onclick=()=>{sfx.click(); start(i);};
  p.querySelector('#talk').onclick=()=>{sfx.click(); intro(i);};
  p.querySelector('#map').onclick=()=>{sfx.click(); home();};
  mount(p);
}
function certificate(){
  const st=totalStars(), rank=RANKS.find(r=>st>=r[0])[1];
  confetti(); sfx.win();
  const p=h(`<section class="panel pop"><div class="result">
    <div class="cert">
      <svg viewBox="0 0 89 100" style="width:44px;height:50px;color:#fff" aria-hidden="true"><use href="#kt-drop"/></svg>
      <small>Удостоверение № ${String(1000+total()).padStart(4,'0')}</small>
      <h2 style="color:#fff">Школа мастера КТ ТРОН</h2>
      <p style="color:#ffffffcc">Присвоена квалификация</p>
      <div class="rank">${esc(rank)}</div>
      <p style="color:#fff;font-weight:800">${st} из 15 ★ · ${total()} монет</p>
    </div>
    ${st<15?`<p class="muted">Собери все 15 звёзд: перепройди уровни без ошибок.</p>`:''}
    <h3 style="color:var(--brand-deep)">Готов к настоящему объекту?</h3>
    <p class="muted">Официальный дистрибьютор в Казахстане: ТОО DARHAN, Алматы, ул. Шевченко 118. Подберём материалы и посчитаем расход под ваш объект. В WhatsApp обычно отвечаем в течение часа.</p>
    <div class="cta">
      <a class="btn green" href="${WA}" target="_blank" rel="noopener">Написать в WhatsApp</a>
      <a class="btn" href="${SITE}/calculator/" target="_blank" rel="noopener">Калькулятор расхода</a>
      <a class="btn ghost" href="${SITE}/#catalog" target="_blank" rel="noopener">Каталог</a>
    </div>
    <p style="font-weight:800;user-select:all">+7 775 181-05-95 · info@kttron.kz</p>
    <div class="row center"><button class="btn ghost" id="map">Карта</button><button class="smallbtn" id="reset">Сбросить прогресс</button></div>
  </div></section>`);
  p.querySelector('#map').onclick=()=>{sfx.click(); home();};
  const r=p.querySelector('#reset');
  r.onclick=()=>{ if(r.dataset.sure){ save.lv={}; persist(); home(); } else { r.dataset.sure=1; r.textContent='Точно сбросить? Нажми ещё раз'; } };
  mount(p);
}

home();
</script>
